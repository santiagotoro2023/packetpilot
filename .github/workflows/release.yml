# Tests, then builds the container image (amd64 and arm64) and the Helm chart and
# publishes both to the GitHub Container Registry:
#   image:  ghcr.io/<owner>/packetpilot:<version> and :latest
#   chart:  oci://ghcr.io/<owner>/charts/packetpilot --version <version>
# The version comes from the file VERSION.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulation, course, challenges and frame exercises
        run: |
          for t in engine course challenges build subnet store; do node test/$t.test.mjs; done
      - name: Installer builds
        run: bash build.sh && git diff --exit-code -- deploy/ || (echo "Run build.sh and commit deploy/ changes" && exit 1)

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/packetpilot
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint, package and push the chart
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          helm lint --strict deploy/helm/packetpilot
          helm package deploy/helm/packetpilot --version "$VERSION" --app-version "$VERSION"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "packetpilot-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
