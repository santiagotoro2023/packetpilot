{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "packetpilot.fullname" . }}
  labels:
    {{- include "packetpilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "packetpilot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - port: http
  # The pods never connect anywhere: nginx only answers
  egress: []
{{- end }}
